[workspace]
git_tag_name = "{{ package }}-v{{ version }}"

# Turning this back on costs ~8½ minutes on every release-plz-pr run (median
# job duration 8m41s) -- and that run time is the window in which a release
# PR merge loses a changelog update (#412, #426, #430).
#
# It is safe off: pg-core, the only publish = true crate with a library API,
# is already checked against the same crates.io baseline by the required
# semver-checks job (scripts/semver-checks.sh). pg-cli, the other publish =
# true crate, is a binary crate with no lib.rs, so cargo-semver-checks has no
# exported surface to check for it regardless of this setting.
semver_check = false

# pg-core: publish to crates.io
[[package]]
name = "pg-core"
publish = true

# pg-cli: publish to crates.io
[[package]]
name = "pg-cli"
publish = true

# pg-pkg: Docker only, no crates.io publish
[[package]]
name = "pg-pkg"
publish = false
git_only = true

# pg-ffi: native binaries only, no crates.io publish
[[package]]
name = "pg-ffi"
publish = false
git_only = true

# cryptify: Docker only, no crates.io publish
#
# Its tags in the old repo were bare `v0.1.27`; this workspace's git_tag_name
# makes them `cryptify-v0.1.28` onward. The old tags are not reachable from
# here (a subtree import brings commits, not tags), so release-plz sees no
# previous release for this package and would otherwise changelog the whole
# imported history into one entry. `git_release_enable = false` on the first
# release, or a hand-placed `cryptify-v0.1.27` tag on the import commit, is
# what stops that; see the note on encryption4all/postguard#255.
[[package]]
name = "cryptify"
publish = false
git_only = true
