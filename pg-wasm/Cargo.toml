[package]
name = "pg-wasm"
version = "0.5.5"
authors = [
  "Leon Botros <l.botros@cs.ru.nl>",
  "Bas Westerbaan <bas@westerbaan.name>",
]
edition = "2021"
license = "MIT"
homepage = "https://github.com/encryption4all/postguard/tree/main/pg-wasm"
description = "PostGuard WebAssembly bindings for the browser"
repository = "https://github.com/encryption4all/postguard/tree/main/pg-wasm"
keywords = ["ibe", "encryption", "ecc"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pg-core = { path = "../pg-core", version = "0.6.0", features = ["web", "stream"] }
wasm-bindgen = { version = "0.2.104" }
js-sys = "0.3"
web-sys = "0.3"
rand = { version = "0.8.4" }
serde = "1.0"
wasm-streams = "0.3"
getrandom = { version = "0.2", features = ["js"] }
futures = "0.3"
wasm-bindgen-futures = "0.4.54"
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
wasm-bindgen-test = "0.3.54"
pg-core = { path = "../pg-core", features = ["rust", "web", "stream", "test"] }
web-sys = { version = "0.3", features = ["console", "Window", "Performance"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]

# Pass wasm-bindgen's --omit-default-module-path so the generated `--target web`
# glue does not emit the unreachable `new URL('index_bg.wasm', import.meta.url)`
# default-module-path branch. Webpack 5 statically resolves that `new URL(...,
# import.meta.url)` as an asset import at build time even though the branch never
# fires for callers that always pass `module_or_path` (e.g. @e4a/pg-js), so
# downstream consumers otherwise hit `Module not found: Can't resolve
# 'index_bg.wasm'`. See #153.
[package.metadata.wasm-pack.profile.release.wasm-bindgen]
omit-default-module-path = true
