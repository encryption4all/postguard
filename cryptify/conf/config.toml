[global]
server_url = "https://postguard.nl/"
address = "0.0.0.0"
data_dir = "/tmp/data"
email_from = "noreply@postguard.nl"
smtp_url = "mailcrab"
smtp_port = 1025
# smtp_username = "user"
# smtp_password = "pw"
# Browser callers that consume the upload/download API cross-origin.
# `postguard.(eu|nl)` is the website; `addin.postguard.eu` is the Outlook
# add-in (prod); `localhost:3000` is the Office add-in dev server.
allowed_origins = "^https://(postguard\\.(eu|nl)|addin\\.postguard\\.eu|localhost:3000)$"
pkg_url = "https://pkg.postguard.eu/"
# When false, notification emails never attribute an upload to its sender,
# not even one whose sender is proven. This is the kill switch for a
# deployment whose mail filters object to the attribution line. Defaults to
# true, and only ever downgrades: no value of it makes an unproven upload
# render attributed.
# attributed_email = false

# Bearer token required to scrape /metrics. Prefer injecting it as a secret
# via the ROCKET_METRICS_TOKEN env var rather than committing it here. When
# unset, /metrics is publicly accessible (a startup warning is logged).
# metrics_token = "change-me"

# Upload limits, in bytes, per tier. A caller presenting an API key that
# pg-pkg validates gets the `api_key_*` pair; everyone else gets the default
# pair, which `GET /limits` serves unauthenticated. Defaults are the values
# these were as constants: 5 GB default tier, 100 GB API-key tier.
# per_upload_limit = 5000000000
# rolling_limit = 5000000000
# api_key_per_upload_limit = 100000000000
# api_key_rolling_limit = 100000000000

# Length of the rolling-quota window, in days. Defaults to 14. Unlike the four
# byte limits, changing this reinterprets usage that was already recorded:
# shrinking it forgives usage that was counted, growing it resurrects usage
# that had expired, and either invalidates the `resets_at` timestamps already
# handed to callers. 0 disables the rolling quota entirely (every record falls
# outside the window at once) and logs a startup warning.
# rolling_window_days = 14
