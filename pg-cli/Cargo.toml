[package]
authors = [
  "Leon Botros <l.botros@cs.ru.nl>",
  "Wouter Geraedts <git@woutergeraedts.nl>",
]
description = "Commandline interface for PostGuard"
edition = "2021"
homepage = "https://github.com/encryption4all/postguard/tree/main/pg-cli"
keywords = ["ibe", "encryption", "ecc"]
license = "MIT"
repository = "https://github.com/encryption4all/postguard"
categories = ["cryptography"]
name = "pg-cli"
version = "0.3.11"

[dependencies]
pg-core = { path = "../pg-core", version = "0.6.6", features = ["stream"] }
futures = "0.3.27"
rand = "0.8.4"
clap = { version = "4", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.57" }
tokio = { version = "1.26.0", features = ["full"] }
irma = { package = "irmars", version = "0.2.2" }
indicatif = "0.18"
inquire = "0.9"
anyhow = "1.0"
url = "2"
