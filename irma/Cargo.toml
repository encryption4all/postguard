[package]
name = "irma"
version = "0.2.1"
authors = ["David Venhoek <david@venhoek.nl>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tweedegolf/irmars"
description = "A rust interface for interacting with IRMA servers (vendored fork for postguard; reqwest 0.12)"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
url = "2"

[dev-dependencies]
maplit = "1.0"
qrcode = "0.14"
serial_test = "3"
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
