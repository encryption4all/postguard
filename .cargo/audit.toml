# cargo-audit configuration for postguard.
# See https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin attack timing sidechannel in `rsa` 0.9.x.
    # Pulled in transitively via `sqlx-mysql` and `jsonwebtoken`. No fixed
    # upstream release is available (advisory still open).
    # Tracked in encryption4all/postguard#177. Drop this entry once `rsa`
    # ships a patched release.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2025-0134 — `rustls-pemfile 1.0.4` is unmaintained. Pulled in
    # transitively via `reqwest 0.11.27` (which we use directly and through
    # `irma 0.2.1`). The real fix is upgrading `reqwest` to 0.12 (and bumping
    # `irma` to a version that uses it). Tracked in encryption4all/postguard#184.
    # Drop this entry once the reqwest 0.12 migration lands.
    "RUSTSEC-2025-0134",

    # RUSTSEC-2026-0058 — `tokio-io 0.1.13` is unmaintained. Pulled in
    # transitively by `futures-util`'s `compat` feature, which is enabled by
    # `reqwest 0.11`, `actix-server`, and `sqlx-core`. No usage in our own
    # code. Cleared by the same reqwest 0.12 / actix / sqlx upgrades tracked
    # for the rustls-pemfile advisory above (postguard#184 follow-up).
    "RUSTSEC-2026-0058",
]
