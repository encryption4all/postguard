on:
  push:
    branches:
      - main
  pull_request:
    # `edited` included for base retargets (e.g. a stacked PR's base merging):
    # paths-filter's verdict depends on the base, and without `edited` a stale
    # verdict stays attached to the unchanged head sha.
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
  workflow_dispatch:

name: Continuous integration

jobs:
  # sonarqube:
  #   name: SonarQube
  #   runs-on: ubuntu-latest
  #   continue-on-error: true
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
  #     - name: SonarQube Scan
  #       uses: SonarSource/sonarqube-scan-action@v6
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  # The matrix keys on the crate directory rather than a `pg-` suffix, because
  # `cryptify` does not carry that prefix. This renames the check contexts from
  # `Test workspace (core)` to `Test workspace (pg-core)`; nothing required
  # points at them today (only the two `Wire compat` contexts are required), but
  # a ruleset added later must use the new names.
  test:
    name: Test workspace
    strategy:
      matrix:
        crate: [pg-core, pg-pkg, pg-cli, pg-ffi, cryptify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: ${{ matrix.crate == 'pg-core' }}
        run: cargo test --manifest-path pg-core/Cargo.toml --features test,rust,stream
      # cryptify declares no features of its own, so `--all-targets` (what its
      # own CI ran) is the equivalent invocation.
      - if: ${{ matrix.crate == 'cryptify' }}
        run: cargo test --manifest-path cryptify/Cargo.toml --all-targets
      - if: ${{ matrix.crate != 'pg-core' && matrix.crate != 'cryptify' }}
        run: cargo test --manifest-path ${{ matrix.crate }}/Cargo.toml --all-features

  format:
    name: Format workspace
    strategy:
      matrix:
        crate: [pg-core, pg-pkg, pg-cli, pg-ffi, cryptify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path ${{ matrix.crate }}/Cargo.toml --all -- --check

  clippy:
    name: Clippy workspace
    strategy:
      matrix:
        crate: [pg-core, pg-pkg, pg-cli, pg-ffi, cryptify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: ${{ matrix.crate == 'pg-core' }}
        run: cargo clippy --manifest-path pg-core/Cargo.toml --all-targets --features test,rust,stream -- -D warnings
      - if: ${{ matrix.crate == 'cryptify' }}
        run: cargo clippy --manifest-path cryptify/Cargo.toml --all-targets -- -D warnings
      - if: ${{ matrix.crate != 'pg-core' && matrix.crate != 'cryptify' }}
        run: cargo clippy --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets --all-features -- -D warnings

  test-wasm-browsers:
    name: Run wasm tests in browsers
    strategy:
      matrix:
        include:
          - browser: chrome
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          - browser: safari
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      WASM_BINDGEN_TEST_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: cargo install wasm-pack
      - if: ${{ matrix.browser == 'firefox' }}
        run: sudo apt update && sudo apt install firefox
      - name: Run wasm-pack browser tests
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          retry_on: error
          timeout_minutes: 20
          command: wasm-pack test --release --headless --\${{ matrix.browser }} ./pg-wasm

  # ---------------------------------------------------------------------------
  # Wire compatibility: HEAD-sealed containers must open with published readers
  # (#251 / #260). #261 adds a wire-compat-js job that downloads the artifact
  # this job uploads.
  #
  # The path filter is a step, not an `on: paths:` key, on purpose: a job that
  # is skipped by a path filter never reports, so a required check would sit
  # pending forever on PRs that do not touch the wire surface. This shape always
  # reports and only does the expensive work when it needs to.
  # ---------------------------------------------------------------------------
  wire-compat-rust:
    name: Wire compat (published pg-core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the PR's changed files
    # wire-compat-js (#261) opens the same bytes with the published npm readers.
    # It downloads the artifact the seal step below produces, so it gates on the
    # same outcome the upload gates on rather than re-running the path filter and
    # drifting out of step with it.
    outputs:
      sealed: ${{ steps.seal.outcome }}
    steps:
      - uses: actions/checkout@v4
      # SHA-pinned as the one action new to this repo; the rest follow the
      # file's existing floating-ref convention.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            wire:
              - 'pg-core/**'
              - 'pg-wasm/**'
              - 'pg-compat/**'
              - 'pg-compat-js/**'
              # pg-core has no lockfile of its own: the bytes HEAD seals are a
              # function of the ROOT lockfile (a bincode-next/ibe/serde bump
              # touches only these two files). Root Cargo.toml also holds the
              # exclude list that keeps pg-compat on crates.io pg-core.
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '.github/workflows/build.yml'

      - if: steps.changes.outputs.wire == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Seal the sample set with HEAD
        id: seal
        if: steps.changes.outputs.wire == 'true'
        shell: bash
        run: |
          cargo run --locked -p pg-core --features stream --example seal-samples \
            -- "$RUNNER_TEMP/wire-compat-artifacts"

      # Hand-off to wire-compat-js (#261). Uploaded before the reader runs so a
      # red gate still leaves the bytes that broke it.
      - name: Upload the sample set
        if: steps.seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wire-compat-artifacts-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/wire-compat-artifacts
          retention-days: 7

      - name: Open it with published pg-core
        if: steps.changes.outputs.wire == 'true'
        shell: bash
        env:
          PG_COMPAT_ARTIFACTS: ${{ runner.temp }}/wire-compat-artifacts
        run: cargo test --manifest-path pg-compat/Cargo.toml --locked

  # pg-compat is outside the workspace, so the per-crate fmt/clippy matrices do
  # not cover it. Kept separate from wire-compat-rust on purpose: a new stable
  # rustc lint must not red a required check named after wire compatibility,
  # nor pre-empt the seal/read steps that answer it.
  pg-compat-lint:
    name: Lint pg-compat
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            wire:
              - 'pg-compat/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '.github/workflows/build.yml'
      - if: steps.changes.outputs.wire == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format pg-compat
        if: steps.changes.outputs.wire == 'true'
        run: cargo fmt --manifest-path pg-compat/Cargo.toml --all -- --check
      - name: Clippy pg-compat
        if: steps.changes.outputs.wire == 'true'
        run: cargo clippy --manifest-path pg-compat/Cargo.toml --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # Public-API semver gate (#253). Fails a PR that breaks pg-core's or pg-wasm's
  # public API without declaring the break.
  #
  # Versions here are bumped by release-plz, not by the PR that makes the
  # change, so "declared" means the conventional-commit `!` marker that
  # release-plz turns into a major bump. The marker is read off the PR title
  # into SEMVER_RELEASE_TYPE; `edited` is already in this file's trigger list,
  # so adding the `!` to the title re-runs the gate.
  #
  # Same always-reports shape as wire-compat-rust: the path filter is a step,
  # not an `on: paths:` key, so a required check never sits pending.
  # ---------------------------------------------------------------------------
  semver-checks:
    name: Public API semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the PR's changed files
    steps:
      # pg-wasm is not published to crates.io, so its baseline is origin/main
      # rather than a registry version, and the full history has to be here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            api:
              - 'pg-core/**'
              - 'pg-wasm/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/semver-checks.sh'
              - 'scripts/semver-checks-test.sh'
              - '.github/workflows/build.yml'

      # Stubs cargo, so it needs no toolchain and runs in under a second. It
      # covers the 100-vs-101 exit-code mapping the gate depends on: 100 is a
      # semver violation, 101 is the tool or the build failing.
      - name: Test the gate script
        if: steps.changes.outputs.api == 'true'
        shell: bash
        run: ./scripts/semver-checks-test.sh

      - if: steps.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Pinned release binary rather than `cargo install` (a five-minute build)
      # or a fourth third-party action. Bump the version and the digest together.
      - name: Install cargo-semver-checks
        if: steps.changes.outputs.api == 'true'
        shell: bash
        env:
          VERSION: 0.49.0
          SHA256: 72f6834d75d28a66e02c9fd6a230ce901bb30eee6067b85867a97445df040e4a
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-semver-checks.tar.gz" \
            "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v${VERSION}/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/cargo-semver-checks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-semver-checks.tar.gz" -C "$HOME/.cargo/bin" cargo-semver-checks

      # The PR title, not the commit subject: PRs are squash-merged here, so the
      # title is what release-plz and the Conventional Commit check read. Passed
      # through the environment rather than interpolated into the script, so a
      # PR title cannot inject shell.
      #
      # The title `!` is the only accepted declaration. A `BREAKING CHANGE:`
      # footer in the PR *body* is deliberately not accepted: this repo's
      # squash_merge_commit_message is COMMIT_MESSAGES, so the body never reaches
      # the squashed commit, and release-plz reads commits. Honouring a body-only
      # footer would pass the gate on a `fix(pg-core):` PR that release-plz then
      # publishes as a patch release of a breaking change.
      - name: Read the breaking-change declaration off the PR title
        id: declared
        if: steps.changes.outputs.api == 'true'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^[a-zA-Z]+(\([^\)]*\))?!: ]]; then
            echo "Breaking change declared in the PR title; a major bump is allowed."
            echo "release_type=major" >> "$GITHUB_OUTPUT"
          else
            echo "No '!' in the PR title; any breaking change will fail the gate."
          fi

      - name: Check the public API
        if: steps.changes.outputs.api == 'true'
        shell: bash
        env:
          SEMVER_RELEASE_TYPE: ${{ steps.declared.outputs.release_type }}
        run: ./scripts/semver-checks.sh
  # The Node half of the same gate (#261): the containers wire-compat-rust
  # sealed must also open with the published npm readers in COMPATIBILITY.md's
  # support window. It downloads rather than re-seals, so both halves are held
  # to the same bytes and a non-deterministic sealer cannot hide between them.
  #
  # `if: !cancelled()` rather than the default: a red wire-compat-rust is
  # exactly when it is worth knowing whether the JS readers broke the same way,
  # and the artifact is uploaded before that job's read step for this reason.
  # Without it, `needs` would skip this job on the run where it has the most to
  # say.
  # ---------------------------------------------------------------------------
  wire-compat-js:
    name: Wire compat (published pg-wasm/pg-js)
    runs-on: ubuntu-latest
    needs: wire-compat-rust
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Every step below is behind the seal outcome, not just the download.
      # `outcome` is 'skipped' when the path filter said no (nothing to open,
      # report success) and 'failure' when sealing itself broke (wire-compat-rust
      # owns that failure; do not report it twice).
      - if: needs.wire-compat-rust.outputs.sealed == 'success'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pg-compat-js/package-lock.json

      - name: Download the sample set
        if: needs.wire-compat-rust.outputs.sealed == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wire-compat-artifacts-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/wire-compat-artifacts

      # ci, not install: the readers are pinned by pg-compat-js/package-lock.json,
      # and a gate that quietly resolved a different reader would be measuring
      # something other than the support window.
      - name: Install the published readers
        if: needs.wire-compat-rust.outputs.sealed == 'success'
        shell: bash
        working-directory: pg-compat-js
        run: npm ci

      - name: Open the set with published pg-wasm/pg-js
        if: needs.wire-compat-rust.outputs.sealed == 'success'
        shell: bash
        working-directory: pg-compat-js
        env:
          PG_COMPAT_ARTIFACTS: ${{ runner.temp }}/wire-compat-artifacts
        run: npm test

  # ---------------------------------------------------------------------------
  # Single required check consolidating the two halves above (#262). Branch
  # protection today lists "Wire compat (published pg-core)" and "Wire compat
  # (published pg-wasm/pg-js)" separately; once this job is green, repointing
  # branch protection at "Wire compat" instead is an admin action left for a
  # maintainer.
  #
  # `if: !cancelled()` for the same reason as wire-compat-js above: this job
  # must still run and report when an upstream half failed, or the required
  # check sits pending forever instead of turning red.
  # ---------------------------------------------------------------------------
  wire-compat:
    name: Wire compat
    runs-on: ubuntu-latest
    needs: [wire-compat-rust, wire-compat-js]
    if: ${{ !cancelled() }}
    steps:
      - name: Require both halves to have passed
        shell: bash
        run: |
          echo "wire-compat-rust: ${{ needs.wire-compat-rust.result }}"
          echo "wire-compat-js: ${{ needs.wire-compat-js.result }}"
          if [[ "${{ needs.wire-compat-rust.result }}" != "success" || "${{ needs.wire-compat-js.result }}" != "success" ]]; then
            exit 1
          fi
